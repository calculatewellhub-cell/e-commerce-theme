name: Build zips

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Rebuild JavaScript bundles
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          npm ci
          node tools/build-js.mjs

      - name: Build theme and plugin zips
        run: bash tools/build-zips.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurelia-zips
          path: dist/*.zip

      - name: Attach zips to the release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "Aurelia $TAG" --generate-notes
          gh release upload "$TAG" dist/aurelia.zip dist/aurelia-commerce.zip --clobber
